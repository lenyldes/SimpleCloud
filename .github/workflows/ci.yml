name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'services/storage-service/go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          working-directory: services/storage-service

  test:
    name: Run Go Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: simplecloud
          POSTGRES_USER: simplecloud_user
          POSTGRES_PASSWORD: simplecloud_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'services/storage-service/go.mod'

      - name: Run unit & integration tests with coverage
        working-directory: services/storage-service
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: simplecloud
          POSTGRES_USER: simplecloud_user
          POSTGRES_PASSWORD: simplecloud_dev_password
          STORAGE_DIR: /tmp/simplecloud_test_storage
          DEFAULT_USER_QUOTA_BYTES: 5368709120
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  deploy:
    name: Deploy to Production
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/simplecloud || cd ~/SimpleCloud
            git pull origin main
            docker compose up -d --build
            docker compose exec -T caddy caddy reload 2>/dev/null || docker exec caddy caddy reload 2>/dev/null || true
