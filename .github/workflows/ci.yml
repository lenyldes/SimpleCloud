name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'services/storage-service/go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.6
          working-directory: services/storage-service

  test:
    name: Run Go Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: simplecloud
          POSTGRES_USER: simplecloud_user
          POSTGRES_PASSWORD: simplecloud_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'services/storage-service/go.mod'

      - name: Run unit & integration tests with coverage
        working-directory: services/storage-service
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: simplecloud
          POSTGRES_USER: simplecloud_user
          POSTGRES_PASSWORD: simplecloud_dev_password
          STORAGE_DIR: /tmp/simplecloud_test_storage
          DEFAULT_USER_QUOTA_BYTES: 5368709120
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
